[package]
name = "siu-tui"
version = "0.0.2"
edition = "2024"
description = "A terminal UI to manage MCP servers and skills across coding agents (Claude Code, Codex, Gemini CLI, Cursor, …)"
license = "MIT"
repository = "https://github.com/nicholasxjy/siu"
readme = "README.md"
keywords = ["mcp", "skills", "claude", "tui", "agents"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "siu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
flate2 = "1.1.10"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
terminal-colorsaurus = "1.0.3"
toml_edit = "0.25.15"
unicode-width = "0.2.2"
# socks-proxy: ALL_PROXY=socks5://… is read first; without it ureq goes direct
ureq = { version = "3.4.2", features = ["socks-proxy"] }
